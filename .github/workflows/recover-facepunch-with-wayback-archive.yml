name: Recover Facepunch snapshot with Wayback-Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wayback-Archive
        run: python -m pip install --upgrade pip wayback-archive

      - name: Download the archived snapshot and assets
        env:
          WAYBACK_URL: "https://web.archive.org/web/20160719005138/http://www.facepunch.com/showthread.php?t=1171345"
          OUTPUT_DIR: "./facepunch-recovered"
          REMOVE_TRACKERS: "true"
          REMOVE_ADS: "true"
          REMOVE_EXTERNAL_IFRAMES: "true"
          REMOVE_EXTERNAL_LINKS_KEEP_ANCHORS: "true"
          MAKE_INTERNAL_LINKS_RELATIVE: "true"
          OPTIMIZE_HTML: "false"
          OPTIMIZE_IMAGES: "false"
          MINIFY_JS: "false"
          MINIFY_CSS: "false"
          MAX_FILES: "500"
        run: wayback-archive

      - name: Audit remaining remote references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("facepunch-recovered")
          report = Path("facepunch-recovered/REMOTE-REFERENCES.txt")
          pattern = re.compile(r'''(?:https?:)?//[^\s"'<>)]+' '', re.I)
          matches = []
          for path in root.rglob("*"):
              if not path.is_file() or path == report:
                  continue
              try:
                  data = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for line_no, line in enumerate(data.splitlines(), 1):
                  if "web.archive.org" in line.lower() or "facepunch.com" in line.lower():
                      matches.append(f"{path}:{line_no}: {line.strip()[:300]}")
          report.write_text(
              "Remaining references containing web.archive.org or facepunch.com. "
              "Review this list before treating the copy as fully independent.\n\n"
              + ("\n".join(matches) if matches else "No matching references found.\n"),
              encoding="utf-8",
          )
          print(f"Audit found {len(matches)} matching lines; see {report}.")
          PY

      - name: Commit recovered copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facepunch-recovered
          if git diff --cached --quiet; then
            echo "No recovered files to commit."
          else
            git commit -m "Recover self-contained Facepunch snapshot"
            git push
          fi
