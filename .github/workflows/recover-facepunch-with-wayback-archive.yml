name: Recover Facepunch snapshot with Wayback-Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Wayback-Archive
        run: python -m pip install --upgrade pip wayback-archive

      - name: Download the archived snapshot and assets
        env:
          WAYBACK_URL: "https://web.archive.org/web/20160719005138/http://www.facepunch.com/showthread.php?t=1171345"
          OUTPUT_DIR: "./facepunch-recovered"
          REMOVE_TRACKERS: "true"
          REMOVE_ADS: "true"
          REMOVE_EXTERNAL_IFRAMES: "false"
          REMOVE_EXTERNAL_LINKS_KEEP_ANCHORS: "true"
          MAKE_INTERNAL_LINKS_RELATIVE: "true"
          OPTIMIZE_HTML: "false"
          OPTIMIZE_IMAGES: "false"
          MINIFY_JS: "false"
          MINIFY_CSS: "false"
          MAX_FILES: "1500"
        run: wayback-archive

      - name: Audit remaining remote references
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          root = Path("facepunch-recovered")
          report = root / "REMOTE-REFERENCES.txt"
          attr = re.compile(r"""\b(?:src|poster|href|srcset)\s*=\s*["']([^"']+)["']""", re.I)
          css_url = re.compile(r"""url\(\s*['"]?([^'")]+)""", re.I)
          css_import = re.compile(r"""@import\s+['"]([^'"]+)""", re.I)
          matches = []
          for path in root.rglob("*"):
              if not path.is_file() or path == report:
                  continue
              try:
                  data = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              patterns = [attr]
              if path.suffix.lower() in {".css", ".scss"}:
                  patterns += [css_url, css_import]
              for pattern in patterns:
                  for match in pattern.finditer(data):
                      value = match.group(1).strip()
                      if value.startswith("//") or urlparse(value).scheme in {"http", "https"}:
                          matches.append(f"{path}: {value}")
          matches = sorted(set(matches))
          report.write_text(
              "Remote URLs still present in HTML/CSS attributes. Some may be ordinary outbound links; "
              "any image, stylesheet, script, font, or CSS background URL must be localized before "
              "this copy can be considered fully self-contained.\n\n"
              + ("\n".join(matches) if matches else "No remote URLs found in scanned attributes.\n"),
              encoding="utf-8",
          )
          print(f"Found {len(matches)} remote URL references; see {report}.")
          PY

      - name: Commit recovered copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facepunch-recovered
          if git diff --cached --quiet; then
            echo "No recovered files to commit."
          else
            git commit -m "Recover self-contained Facepunch snapshot"
            git push
          fi
