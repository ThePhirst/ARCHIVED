name: Recover Facepunch snapshot assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and localize snapshot assets
        run: python asset-recovery/rebuild_snapshot.py
      - name: Commit localized snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/facepunch asset-recovery/missing-assets.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Localize Facepunch snapshot assets"
            git push
          fi
