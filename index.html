<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>Hammer Editor red X overlay bug</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    #thread { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="thread" title="gm_construct Map Project — archived Facepunch thread"
    src="facepunch-recovered/showthread-edit.html"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('thread');
      function resizeFrame() {
        try {
          var doc = frame.contentDocument;
          if (!doc) return;
          var height = Math.max(
            doc.documentElement ? doc.documentElement.scrollHeight : 0,
            doc.body ? doc.body.scrollHeight : 0,
            window.innerHeight
          );
          frame.style.height = height + 'px';
        } catch (e) {
          frame.style.height = '100vh';
        }
      }
      frame.addEventListener('load', function () {
        resizeFrame();
        try {
          var doc = frame.contentDocument;
          if (doc && doc.documentElement && window.ResizeObserver) {
            new ResizeObserver(resizeFrame).observe(doc.documentElement);
          }
          if (doc) {
            doc.addEventListener('load', resizeFrame, true);
            if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(resizeFrame);
          }
        } catch (e) {}
      });
      window.addEventListener('resize', resizeFrame);
    })();
  </script>
</body>
</html>
